[project]
name = "codegraph-api"
version = "0.1.0"
description = "CodeGraph AI backend — graph-augmented RAG for Python source-code understanding and change-impact analysis."
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "TBD" }

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "neo4j>=5.20,<6.0",
    "chromadb>=0.5,<1.0",
    # Only langchain-core (a shared transitive base) plus the two chat-model
    # integrations we actually construct (see app/rag/llm_provider.py) are
    # direct dependencies. Plain "langchain", "langchain-community", and
    # "langchain-chroma" were previously listed here but nothing in app/
    # imports them (ChromaDB is accessed directly via the `chromadb`
    # package, not langchain-chroma) — removed as unused, per Prompt 11.5
    # "genuinely transferable": fewer, correctly-pinned dependencies mean a
    # fresh `pip install` is more likely to actually succeed.
    "langchain-core>=0.3,<0.4",
    "langchain-anthropic>=0.3,<0.4",
    "langchain-openai>=0.2,<0.3",
    # Used at runtime by app/core/dependencies/status_service.py's LM
    # Studio/OpenAI-compatible connectivity check, and by
    # scripts/check_llm.py — no longer dev-only.
    "httpx>=0.27,<1.0",
    "tree-sitter>=0.22,<0.23",
    "tree-sitter-python>=0.21,<0.22",
    "sentence-transformers>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
# Parser test fixtures are deliberately-invalid/undefined-name snippets —
# they are parser *input*, not code meant to lint or run.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: Depends(...)/File(...)/Form(...) in argument defaults is the
# standard FastAPI dependency-injection idiom, not a real bug.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "langchain_core.*",
    "langchain_anthropic.*",
    "langchain_openai.*",
    "tree_sitter.*",
    "tree_sitter_python.*",
    "neo4j.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "real_model: needs network access to download the real configured embedding model; opt-in only (set RUN_REAL_EMBEDDING_MODEL_TESTS=1), skipped by default.",
]
# Needed for app.rag's async query-analysis/hybrid-retrieval tests
# (StructuredLLMProvider.generate_structured / hybrid_retriever.retrieve
# are async) — "auto" runs any `async def test_*` without requiring an
# explicit `@pytest.mark.asyncio` on every one.
asyncio_mode = "auto"
