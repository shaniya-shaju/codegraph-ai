# Local orchestration for CodeGraph AI — see ARCHITECTURE.md "Deployment view".
#
# Variables below read from a root .env file if present (copy .env.example
# to .env first); every variable also has an inline default so `docker
# compose config` and `docker compose up` both work out of the box without
# one, per CONTRIBUTING.md.

services:
  neo4j:
    # Pinned to a specific released version (not the floating `5-community`
    # or `latest` tags) so a fresh `docker compose up` reproduces the same
    # Neo4j build every time — see docs/HANDOVER.md "Updating the project"
    # for how to move this pin forward deliberately. Compatible with the
    # `neo4j` Python driver pin in backend/pyproject.toml (>=5.20,<6.0).
    image: neo4j:5.26.29-community
    container_name: codegraph-neo4j
    ports:
      - "7475:7474" # Neo4j Browser / HTTP (host remapped: 7474 already used by another local container)
      - "7688:7687" # Bolt protocol (host remapped: 7687 already used by another local container)
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-changeme}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codegraph-backend
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # SQLite/Chroma data live on the backend_data volume inside the container.
      DATABASE_URL: sqlite:////data/codegraph.db
      # ChromaDB is embedded (persistent local directory, not a separate
      # service) — see ARCHITECTURE.md "Deployment view".
      CHROMA_PERSIST_DIRECTORY: /data/chroma
      CHROMA_COLLECTION_PREFIX: ${CHROMA_COLLECTION_PREFIX:-codegraph}
      # Container-to-container hostname, not the host-facing bolt://localhost:7687.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      NEO4J_CONNECTION_TIMEOUT_SECONDS: ${NEO4J_CONNECTION_TIMEOUT_SECONDS:-10}
      NEO4J_MAX_CONNECTION_POOL_SIZE: ${NEO4J_MAX_CONNECTION_POOL_SIZE:-50}
      # Fail-fast settings (see backend/app/graph/neo4j_client.py) — bound
      # a single call's retry loop and open the circuit breaker after
      # repeated failures so a Neo4j outage never causes every request to
      # wait tens of seconds.
      NEO4J_OPERATION_TIMEOUT_SECONDS: ${NEO4J_OPERATION_TIMEOUT_SECONDS:-3}
      NEO4J_CIRCUIT_FAILURE_THRESHOLD: ${NEO4J_CIRCUIT_FAILURE_THRESHOLD:-3}
      NEO4J_CIRCUIT_COOLDOWN_SECONDS: ${NEO4J_CIRCUIT_COOLDOWN_SECONDS:-30}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
      LLM_API_KEY: ${LLM_API_KEY:-changeme}
      # Only used when LLM_PROVIDER is openai_compatible/lmstudio. The
      # default here assumes LM Studio running on the host with Docker
      # Desktop (Mac/Windows) — see .env.example's LM STUDIO section and
      # this service's `extra_hosts` below for the Linux equivalent.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1024}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_HEALTH_CHECK_TIMEOUT_SECONDS: ${LLM_HEALTH_CHECK_TIMEOUT_SECONDS:-2.0}
      # sentence_transformers runs locally inside this container — no
      # repository code leaves it for embedding generation. The default
      # model needs no EMBEDDING_TRUST_REMOTE_CODE opt-in (see
      # .env.example) — switching to a model that does needs that set
      # explicitly, it is never enabled automatically.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sentence_transformers}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      EMBEDDING_NORMALIZE: ${EMBEDDING_NORMALIZE:-true}
      EMBEDDING_MAX_SEQUENCE_LENGTH: ${EMBEDDING_MAX_SEQUENCE_LENGTH:-4096}
      EMBEDDING_TRUST_REMOTE_CODE: ${EMBEDDING_TRUST_REMOTE_CODE:-false}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-changeme}
      VECTOR_DEFAULT_TOP_K: ${VECTOR_DEFAULT_TOP_K:-8}
      VECTOR_MAX_TOP_K: ${VECTOR_MAX_TOP_K:-30}
      VECTOR_MIN_SCORE: ${VECTOR_MIN_SCORE:-0.0}
      CODE_CHUNK_MAX_CHARACTERS: ${CODE_CHUNK_MAX_CHARACTERS:-4000}
      CODE_CHUNK_MAX_LINES: ${CODE_CHUNK_MAX_LINES:-200}
      CODE_CHUNK_CONTEXT_LINES: ${CODE_CHUNK_CONTEXT_LINES:-3}
      INDEXING_BATCH_SIZE: ${INDEXING_BATCH_SIZE:-32}
      INGESTION_ALLOWED_BASE_DIR: /data/allowed_repos
      INGESTION_WORKSPACE_DIR: /data/workspaces
      INGESTION_CLONE_TIMEOUT_SECONDS: ${INGESTION_CLONE_TIMEOUT_SECONDS:-120}
      INGESTION_MAX_REPO_SIZE_MB: ${INGESTION_MAX_REPO_SIZE_MB:-500}
      INGESTION_MAX_UPLOAD_SIZE_MB: ${INGESTION_MAX_UPLOAD_SIZE_MB:-50}
      # Remote repository URL cloning (POST /api/v1/repositories/clone) —
      # see .env.example's "Remote repository URL cloning" section and
      # SECURITY.md "Repository acquisition safety". Without these, a
      # Docker-run backend always falls back to this block's defaults
      # regardless of what's set in the host's .env.
      REPO_URL_CLONE_ENABLED: ${REPO_URL_CLONE_ENABLED:-true}
      REPO_CLONE_ALLOWED_HOSTS: ${REPO_CLONE_ALLOWED_HOSTS:-github.com,gitlab.com}
      REPO_CLONE_DEPTH: ${REPO_CLONE_DEPTH:-1}
      IMPACT_ANALYSIS_DEFAULT_MAX_DEPTH: ${IMPACT_ANALYSIS_DEFAULT_MAX_DEPTH:-3}
    # Makes `host.docker.internal` resolve to the host machine on Linux
    # too (Docker Desktop on Mac/Windows already provides this out of the
    # box) — required for LLM_BASE_URL=http://host.docker.internal:1234/v1
    # to reach an LM Studio server running on the host. See
    # docs/LOCAL_LLM_SETUP.md "Docker vs local base URL".
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_data:/data
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      # Liveness only — never blocks on Neo4j/Chroma/the embedding model
      # (see backend/app/api/routes/health.py's GET /health/live). Use
      # GET /health/ready separately to check dependency status.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    image: node:20-slim
    container_name: codegraph-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      # Browser-side base URL — the browser hits the host-published backend
      # port directly, not the docker-network hostname.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  neo4j_data:
  neo4j_logs:
  backend_data:
  frontend_node_modules:
